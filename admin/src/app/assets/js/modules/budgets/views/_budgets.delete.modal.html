<div class="modal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">

      <div class="modal-header">
        <h4 class="modal-title">Delete budget</h4>
      </div>

      <div class="modal-body">
        <p>
          The budget <strong>{{ budget.name }}</strong> will be deleted.
          This action cannot be undone.
        </p>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-default" ng-click="$hide()">Cancel</button>
        <button type="button" class="btn btn-danger" ng-click="confirm()">Accept</button>
      </div>

    </div>
  </div>
</div>
